services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    depends_on:
      - backend
    command: npm run dev
    networks:
      - engida-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
      - AI_SERVICE_URL=http://ai-service:8000
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql://engida:1921@host.docker.internal:5433/engida}
      - DATABASE_SYNCHRONIZE=false
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in the root .env file}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in the root .env file}
    depends_on:
      - ai-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: npm run start:dev
    networks:
      - engida-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app
    environment:
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=["http://localhost:3001","http://localhost:3000"]
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    networks:
      - engida-network

networks:
  engida-network:
    driver: bridge
